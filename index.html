<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEEPPULSE RECORDS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Raleway:wght@100;200;300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: rgba(201,168,76,0.15);
    --white: #f5f0e8;
    --bg: #080808;
  }

  html, body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Raleway', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    cursor: none;
    /* Disable touch callout and selection highlight on mobile */
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Custom cursor — hidden on touch devices */
  .cursor {
    position: fixed;
    width: 6px; height: 6px;
    background: var(--gold);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    transition: transform 0.1s ease, opacity 0.3s;
    mix-blend-mode: screen;
  }
  .cursor-ring {
    position: fixed;
    width: 32px; height: 32px;
    border: 1px solid rgba(201,168,76,0.4);
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate(-50%, -50%);
    transition: transform 0.18s ease, width 0.3s, height 0.3s, opacity 0.3s;
  }
  @media (hover: none) and (pointer: coarse) {
    /* Touch device — hide custom cursor elements entirely */
    .cursor, .cursor-ring { display: none !important; }
    html, body { cursor: auto; }
  }

  /* ===================== LOADING SCREEN ===================== */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 10000;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    transition: opacity 0.9s cubic-bezier(0.4,0,0.2,1), visibility 0.9s;
  }
  #loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loader-logo {
    text-align: center;
    animation: loaderPulse 2.4s ease-in-out infinite;
  }
  .loader-logo-main {
    display: block;
    font-family: 'Raleway', sans-serif;
    font-weight: 100;
    font-size: clamp(1rem, 4vw, 1.3rem);
    letter-spacing: 0.55em;
    color: var(--white);
    -webkit-font-smoothing: antialiased;
  }
  .loader-logo-sub {
    display: block;
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: clamp(0.45rem, 1.5vw, 0.6rem);
    letter-spacing: 0.65em;
    color: rgba(245,240,232,0.35);
    margin-top: 7px;
  }

  @keyframes loaderPulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* Gold progress bar */
  .loader-bar-track {
    width: 120px;
    height: 1px;
    background: rgba(201,168,76,0.12);
    position: relative;
    overflow: hidden;
  }
  .loader-bar-fill {
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
    animation: loaderSweep 1.6s cubic-bezier(0.4,0,0.2,1) infinite;
  }
  @keyframes loaderSweep {
    0%   { left: -100%; opacity: 0; }
    10%  { opacity: 1; }
    100% { left: 100%; opacity: 0.4; }
  }

  /* Ambient noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1;
    opacity: 0.6;
  }

  /* Radial vignette */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* Ambient glow blobs */
  .ambient {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .ambient-1 {
    width: 600px; height: 400px;
    background: radial-gradient(ellipse, rgba(180,130,30,0.08) 0%, transparent 70%);
    top: 20%; left: -10%;
    animation-delay: 0s;
  }
  .ambient-2 {
    width: 500px; height: 300px;
    background: radial-gradient(ellipse, rgba(201,168,76,0.06) 0%, transparent 70%);
    bottom: 30%; right: -5%;
    animation-delay: -9s;
  }
  @keyframes drift {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(40px, -30px) scale(1.1); }
  }

  /* Layout */
  .page {
    position: relative;
    z-index: 3;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 32px;
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 36px 0 0;
    opacity: 0;
    animation: fadeUp 1s ease 0.3s forwards;
  }
  .menu-icon { display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
  .menu-icon span {
    display: block;
    width: 22px; height: 1px;
    background: var(--white);
    opacity: 0.7;
    transition: opacity 0.3s;
  }
  .menu-icon:hover span { opacity: 1; }

  .logo {
    text-align: center;
    letter-spacing: 0.35em;
    line-height: 1;
  }
  .logo-main {
    font-size: 0.78rem;
    font-weight: 200;
    letter-spacing: 0.4em;
    color: var(--white);
    display: block;
  }
  .logo-sub {
    font-size: 0.55rem;
    font-weight: 300;
    letter-spacing: 0.5em;
    color: rgba(245,240,232,0.45);
    display: block;
    margin-top: 4px;
  }

  .header-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--white);
    opacity: 0.7;
  }

  /* Artist list */
  .artist-list {
    flex: 1;
    padding: 60px 0 20px;
  }

  .artist-item {
    position: relative;
    opacity: 0;
    transform: translateX(-20px);
    animation: slideIn 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
    cursor: pointer;
  }

  @keyframes slideIn {
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Glow line at bottom of each item */
  .artist-divider {
    height: 1px;
    background: linear-gradient(90deg, rgba(201,168,76,0.6) 0%, rgba(201,168,76,0.08) 50%, transparent 100%);
    position: relative;
    overflow: hidden;
  }
  .artist-divider::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,220,120,0.9), transparent);
    animation: shimmer 4s ease-in-out infinite;
  }
  @keyframes shimmer {
    0% { left: -60%; opacity: 0; }
    20% { opacity: 1; }
    60% { left: 120%; opacity: 0.6; }
    100% { left: 120%; opacity: 0; }
  }

  .artist-name {
    font-family: 'Raleway', sans-serif;
    font-weight: 100;
    font-size: clamp(1.6rem, 5vw, 2.1rem);
    letter-spacing: 0.22em;
    color: var(--white);
    padding: 22px 0 20px;
    display: block;
    position: relative;
    transition: color 0.4s ease, letter-spacing 0.4s ease;
    -webkit-font-smoothing: antialiased;
  }

  .artist-item:hover .artist-name {
    color: var(--gold-light);
    letter-spacing: 0.28em;
  }

  /* Hover glow on left */
  .artist-item::before {
    content: '';
    position: absolute;
    left: -32px;
    top: 50%;
    transform: translateY(-50%) scaleY(0);
    width: 2px;
    height: 60%;
    background: linear-gradient(180deg, transparent, var(--gold), transparent);
    transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s;
    opacity: 0;
  }
  .artist-item:hover::before {
    transform: translateY(-50%) scaleY(1);
    opacity: 1;
  }

  /* Ambient hover glow behind text */
  .artist-item .hover-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 0% 50%, rgba(201,168,76,0.04) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }
  .artist-item:hover .hover-glow { opacity: 1; }

  /* Footer */
  footer {
    padding: 24px 0 40px;
    text-align: center;
    opacity: 0;
    animation: fadeUp 1s ease 1.8s forwards;
  }
  .footer-label {
    font-size: 0.5rem;
    font-weight: 300;
    letter-spacing: 0.5em;
    color: rgba(245,240,232,0.3);
    display: block;
    margin-bottom: 18px;
  }
  .footer-logo-icon {
    display: inline-block;
    width: 32px; height: 24px;
    position: relative;
  }
  .footer-logo-icon::before,
  .footer-logo-icon::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    height: 1px;
    background: rgba(245,240,232,0.3);
  }
  .footer-logo-icon::before { top: 6px; }
  .footer-logo-icon::after { bottom: 6px; }
  .footer-logo-icon span {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 14px; height: 1px;
    background: rgba(245,240,232,0.3);
  }

  /* === MODAL === */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .modal-backdrop.open {
    opacity: 1;
    pointer-events: all;
  }
  .modal-blur {
    position: absolute;
    inset: 0;
    background: rgba(4,4,4,0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }

  .modal {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    background: linear-gradient(135deg, rgba(18,15,10,0.98) 0%, rgba(10,8,6,0.98) 100%);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 2px;
    padding: 48px 40px 40px;
    transform: translateY(30px) scale(0.97);
    transition: transform 0.5s cubic-bezier(0.16,1,0.3,1);
    box-shadow:
      0 0 0 1px rgba(201,168,76,0.05),
      0 40px 80px rgba(0,0,0,0.8),
      0 0 60px rgba(201,168,76,0.04);
  }
  .modal-backdrop.open .modal {
    transform: translateY(0) scale(1);
  }

  /* Modal corner accents */
  .modal::before, .modal::after {
    content: '';
    position: absolute;
    width: 20px; height: 20px;
    border-color: rgba(201,168,76,0.4);
    border-style: solid;
  }
  .modal::before { top: -1px; left: -1px; border-width: 1px 0 0 1px; }
  .modal::after { bottom: -1px; right: -1px; border-width: 0 1px 1px 0; }

  .modal-close {
    position: absolute;
    top: 20px; right: 24px;
    background: none;
    border: none;
    color: rgba(245,240,232,0.4);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    cursor: pointer;
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    transition: color 0.3s;
  }
  .modal-close:hover { color: var(--white); }

  .modal-artist {
    font-family: 'Raleway', sans-serif;
    font-weight: 100;
    font-size: 1.6rem;
    letter-spacing: 0.25em;
    color: var(--white);
    margin-bottom: 6px;
    -webkit-font-smoothing: antialiased;
  }
  .modal-subtitle {
    font-size: 0.5rem;
    letter-spacing: 0.45em;
    color: rgba(201,168,76,0.6);
    font-weight: 300;
    margin-bottom: 36px;
    display: block;
  }

  .modal-divider {
    height: 1px;
    background: linear-gradient(90deg, rgba(201,168,76,0.5) 0%, rgba(201,168,76,0.05) 70%, transparent 100%);
    margin-bottom: 32px;
  }

  .dsp-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .dsp-link {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    text-decoration: none;
    color: var(--white);
    border: 1px solid transparent;
    border-radius: 1px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .dsp-link::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(201,168,76,0.06) 0%, transparent 100%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .dsp-link:hover::before { opacity: 1; }
  .dsp-link:hover {
    border-color: rgba(201,168,76,0.2);
    color: var(--gold-light);
    transform: translateX(4px);
  }

  .dsp-icon {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 1rem;
  }
  .dsp-icon.spotify { background: rgba(30,215,96,0.12); }
  .dsp-icon.apple { background: rgba(252,60,68,0.12); }
  .dsp-icon.amazon { background: rgba(255,153,0,0.12); }
  .dsp-icon.pandora { background: rgba(0,167,229,0.12); }

  .dsp-name {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    font-weight: 300;
    flex: 1;
  }
  .dsp-arrow {
    font-size: 0.7rem;
    opacity: 0.3;
    transition: opacity 0.3s, transform 0.3s;
  }
  .dsp-link:hover .dsp-arrow { opacity: 0.8; transform: translateX(3px); }

  .dsp-coming-soon {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 14px 16px;
    opacity: 0.25;
    pointer-events: none;
  }
  .coming-soon-text {
    font-size: 0.55rem;
    letter-spacing: 0.35em;
    font-weight: 200;
    font-style: italic;
    color: var(--white);
    flex: 1;
  }

  /* Stagger animations */
  .artist-item:nth-child(1) { animation-delay: 0.5s; }
  .artist-item:nth-child(2) { animation-delay: 0.65s; }
  .artist-item:nth-child(3) { animation-delay: 0.8s; }
  .artist-item:nth-child(4) { animation-delay: 0.95s; }
  .artist-item:nth-child(5) { animation-delay: 1.1s; }
  .artist-item:nth-child(6) { animation-delay: 1.25s; }
  .artist-item:nth-child(7) { animation-delay: 1.4s; }
  .artist-item:nth-child(8) { animation-delay: 1.55s; }

  /* Divider shimmer delays */
  .artist-item:nth-child(1) .artist-divider::after { animation-delay: 0s; }
  .artist-item:nth-child(2) .artist-divider::after { animation-delay: 0.5s; }
  .artist-item:nth-child(3) .artist-divider::after { animation-delay: 1s; }
  .artist-item:nth-child(4) .artist-divider::after { animation-delay: 1.5s; }
  .artist-item:nth-child(5) .artist-divider::after { animation-delay: 2s; }
  .artist-item:nth-child(6) .artist-divider::after { animation-delay: 2.5s; }
  .artist-item:nth-child(7) .artist-divider::after { animation-delay: 3s; }
  .artist-item:nth-child(8) .artist-divider::after { animation-delay: 3.5s; }

  @media (max-width: 480px) {
    .page { padding: 0 24px; }
    .modal { padding: 40px 28px 32px; }
    .artist-name { font-size: 1.4rem; }
  }
</style>
</head>
<body>

<!-- Loading Screen -->
<div id="loader">
  <div class="loader-logo">
    <span class="loader-logo-main">DEEPPULSE</span>
    <span class="loader-logo-sub">RECORDS</span>
  </div>
  <div class="loader-bar-track">
    <div class="loader-bar-fill"></div>
  </div>
</div>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<div class="ambient ambient-1"></div>
<div class="ambient ambient-2"></div>

<div class="page">
  <header>
    <div style="width:22px"></div>
    <div class="logo">
      <span class="logo-main">DEEPPULSE</span>
      <span class="logo-sub">RECORDS</span>
    </div>
    <div style="width:22px"></div>
  </header>

  <div class="artist-list" id="artistList"></div>

  <footer>
    <span class="footer-label">AMBIENT CATALOG</span>
    <div class="footer-logo-icon"><span></span></div>
  </footer>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal-blur" id="modalBlur"></div>
  <div class="modal">
    <button class="modal-close" id="modalClose">CLOSE ×</button>
    <div class="modal-artist" id="modalArtistName"></div>
    <span class="modal-subtitle">LISTEN ON</span>
    <div class="modal-divider"></div>
    <div class="dsp-list" id="dspList"></div>
  </div>
</div>

<script>
  // Loading screen
  const loader = document.getElementById('loader');
  window.addEventListener('load', () => {
    setTimeout(() => loader.classList.add('hidden'), 1200);
  });
  // Fallback in case fonts are slow
  setTimeout(() => loader.classList.add('hidden'), 3000);

  // Custom cursor — desktop only
  const cursor = document.getElementById('cursor');
  const cursorRing = document.getElementById('cursorRing');
  let mx = 0, my = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  function animateCursor() {
    cursor.style.left = mx + 'px';
    cursor.style.top = my + 'px';
    rx += (mx - rx) * 0.12;
    ry += (my - ry) * 0.12;
    cursorRing.style.left = rx + 'px';
    cursorRing.style.top = ry + 'px';
    requestAnimationFrame(animateCursor);
  }
  animateCursor();
  document.querySelectorAll('a, button, .artist-item').forEach(el => {
    el.addEventListener('mouseenter', () => cursorRing.style.transform = 'translate(-50%,-50%) scale(1.8)');
    el.addEventListener('mouseleave', () => cursorRing.style.transform = 'translate(-50%,-50%) scale(1)');
  });

  // DSP icons as SVG paths (inline emoji fallback)
  const DSP_ICONS = {
    spotify: { emoji: '♫', color: '#1ed760' },
    apple:   { emoji: '♪', color: '#fc3c44' },
    amazon:  { emoji: '◈', color: '#ff9900' },
    pandora: { emoji: '◉', color: '#00a7e5' },
  };

  const ARTISTS = [

        { platform: 'apple',   label: 'APPLE MUSIC', url: 'https://music.apple.com/pt/artist/rem%C3%B8ra/1836144007' },
        { platform: 'amazon',  label: 'AMAZON MUSIC', url: 'https://www.amazon.com/music/player/artists/B0F7Y23MXH/rem%C3%B8ra' },
        { platform: 'pandora', label: 'PANDORA', url: 'https://pandora.app.link/UXvQOySL0Vb' },
      ]
    },
    {
      name: 'MIREO SUN',
      links: [
        { platform: 'spotify', label: 'SPOTIFY', url: null },
        { platform: 'apple',   label: 'APPLE MUSIC', url: null },
        { platform: 'amazon',  label: 'AMAZON MUSIC', url: null },
        { platform: 'pandora', label: 'PANDORA', url: null },
      ]
    },
    {
      name: 'NOVARION',
      links: [
        { platform: 'spotify', label: 'SPOTIFY', url: 'https://open.spotify.com/intl-pt/artist/7DiT7CA5PgStZrg6shM4Pl' },
        { platform: 'apple',   label: 'APPLE MUSIC', url: 'https://music.apple.com/us/artist/novarion/1820351682' },
        { platform: 'amazon',  label: 'AMAZON MUSIC', url: 'https://music.amazon.com/artists/B0FD35MVYW/novarion' },
        { platform: 'pandora', label: 'PANDORA', url: 'https://www.pandora.com/artist/novarion/ARfltqg3j2kz5tK?part=ug-desktop&corr=84571138021155939' },
      ]
    },
    {
      name: 'THEO SOUMNA',
      links: [
        { platform: 'spotify', label: 'SPOTIFY', url: 'https://open.spotify.com/artist/3LrO6ZDSpahX11KkDWGJCg?si=FT9sfBwST86WESjpdK_dvQ' },
        { platform: 'apple',   label: 'APPLE MUSIC', url: 'https://music.apple.com/pt/artist/theo-soumna/1872123041' },
        { platform: 'amazon',  label: 'AMAZON MUSIC', url: 'https://music.amazon.com/artists/B0GJTXK638?ref=dm_sh_i7vd3YJz2OtAVeTXXlvkjfNhf' },
        { platform: 'pandora', label: 'PANDORA', url: 'https://pandora.app.link/kgCKaxAIW2b' },
      ]
    },
    {
      name: 'OWEN MAREK',
      links: [

        { platform: 'pandora', label: 'PANDORA', url: 'https://pandora.app.link/Cxz7jryIW2b' },

      name: 'ELIAS VARYN',
      links: [
        { platform: 'spotify', label: 'SPOTIFY', url: null },
        { platform: 'apple',   label: 'APPLE MUSIC', url: null },

        { platform: 'amazon',  label: 'AMAZON MUSIC', url: null },
        { platform: 'pandora', label: 'PANDORA', url: null },
      ]
    },
  ];

  // Render artist list
  const listEl = document.getElementById('artistList');
  ARTISTS.forEach((artist, i) => {
    const item = document.createElement('div');
    item.className = 'artist-item';
    item.innerHTML = `
      <div class="hover-glow"></div>
      <span class="artist-name">${artist.name}</span>
      <div class="artist-divider"></div>
    `;
    item.addEventListener('click', () => openModal(artist));
    listEl.appendChild(item);
  });

  // Modal logic
  const backdrop = document.getElementById('modalBackdrop');
  const modalBlur = document.getElementById('modalBlur');
  const modalClose = document.getElementById('modalClose');
  const modalArtistName = document.getElementById('modalArtistName');
  const dspList = document.getElementById('dspList');

  function openModal(artist) {
    modalArtistName.textContent = artist.name;
    dspList.innerHTML = '';

    artist.links.forEach(link => {
      const icon = DSP_ICONS[link.platform];
      if (link.url) {
        const a = document.createElement('a');
        a.className = 'dsp-link';
        a.href = link.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.innerHTML = `
          <div class="dsp-icon ${link.platform}" style="color:${icon.color}">${icon.emoji}</div>
          <span class="dsp-name">${link.label}</span>
          <span class="dsp-arrow">→</span>
        `;
        dspList.appendChild(a);
      } else {
        const div = document.createElement('div');
        div.className = 'dsp-coming-soon';
        div.innerHTML = `
          <div class="dsp-icon ${link.platform}" style="color:${icon.color};opacity:0.3">${icon.emoji}</div>
          <span class="dsp-name" style="opacity:0.5">${link.label}</span>
          <span class="coming-soon-text">COMING SOON</span>
        `;
        dspList.appendChild(div);
      }
    });

    backdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    backdrop.classList.remove('open');
    document.body.style.overflow = '';
  }

  modalClose.addEventListener('click', closeModal);
  modalBlur.addEventListener('click', closeModal);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>
</body>
